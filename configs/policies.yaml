# Routing and execution policy. Tune these without changing code.

name: balanced
prefer_local: true
local_bonus_usd: 0.0008
latency_weight_usd_per_second: 0.0004
max_escalations: 1
default_budget_usd: 0.25
allow_cloud: true
allow_local: true
shadow_log_alternates: 3

# Minimum capability (0-10) by task type and complexity (1-5).
floors:
  classification: [4, 5, 6, 7, 8]
  extraction: [5, 6, 7, 8, 8]
  summarization: [5, 6, 7, 7, 8]
  conversation: [5, 6, 7, 7, 8]
  writing: [5, 6, 7, 8, 9]
  translation: [5, 6, 7, 8, 8]
  planning: [5, 6, 7, 8, 9]
  code: [5, 6, 7, 8, 9]
  reasoning: [5, 6, 7, 8, 9]
  vision: [5, 6, 7, 8, 9]
  embedding: [6, 7, 8, 8, 9]

# Extra estimated output tokens used when the caller does not specify a cap.
default_output_tokens:
  classification: 80
  extraction: 400
  summarization: 350
  conversation: 400
  writing: 900
  translation: 600
  planning: 700
  code: 900
  reasoning: 800
  vision: 400
  embedding: 0

quality_gates:
  require_nonempty: true
  json_for_extraction: true
  escalate_on_gate_failure: true
